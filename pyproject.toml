[project]
name = "gateway-discovery-demo"
version = "0.1.0"
description = "Strands agent + AgentCore Gateway: dynamic tool discovery with least-privilege enterprise tools"
requires-python = ">=3.14"
dependencies = [
  "boto3>=1.40",
  "requests>=2.32",
  "strands-agents>=1.59",
  "mcp>=1.20",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
line-length = 130
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
